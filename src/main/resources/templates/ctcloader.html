<!DOCTYPE html>
<!-- タイムリーフとスプリングセキュリティを名前空間に追加 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CtCloader</title>
    <meta name="description" content="ファイルのダウンロードとアップロードとファイル転送サービスのページ">

    <!-- csrfトークンとヘッダー -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- uppy(アップローダー) -->
    <script src="https://cdn.jsdelivr.net/npm/uppy@5.2.4/dist/uppy.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/uppy@5.2.4/dist/uppy.min.css" rel="stylesheet">
    <script src="https://releases.transloadit.com/uppy/locales/v3.3.1/ja_JP.min.js"></script>

    <!-- bootstrap -->
    <link href="css/bootstrap.css" rel="stylesheet">
    <script src="js/bootstrap.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- dataTables -->
    <script src="https://cdn.datatables.net/2.3.8/js/dataTables.js"></script>
    <link href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.css" rel="stylesheet">

    <script src="js/ctcloader.js"></script>

</head>
<body>
<nav class="navbar navbar-expand bg-body-tertiary sticky-top border-bottom" data-bs-theme="light">
    <!-- アップロード用モーダル表示ボタン -->
    <div class="container-fluid">
        <div class="d-flex align-items-center gap-2">
            <!-- アプリ名 -->
            <span class="navbar-brand d-flex align-items-center gap-2 p-0">
                <img src="img/karilogo.png" alt="logo" style="height: 32px; width: auto;">
                <span class="navbar-brand fw-bold text-dark m-0">CtCloader</span>
            </span>

            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">アップロード</button>
        </div>

        <div class="ms-auto d-flex gap-1">
            <span id="notLoggedIn">
            <button type="button" class="btn btn-primary" id="registrationButton">ユーザー登録</button>
            <button type="button" class="btn btn-primary" id="loginButton">ログイン</button>
            </span>
            <span id="loggedIn">
            <button type="button" class="btn btn-info fw-semibold">user</button>
            <button type="button" class="btn btn-danger" id="logoutButton">ログアウト</button>
            </span>
        </div>
    </div>
</nav>
<!-- アップロード用モーダル -->
<div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5">ファイルアップロード</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="uploadModalCloseButtonHeader"></button>
            </div>
            <div class="modal-body">
                <div class="container">
                    <div class="row">
                        <div class="col-md-6">
                            <form id="uploadForm" novalidate>
                                <div class="row mb-5" id="setDeletePassword_div">
                                    <label for="setDeletePassword"
                                           class="col-form-label col-sm-5">削除用パスワード</label>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control" id="setDeletePassword" required
                                               pattern="[a-zA-Z0-9]{4,12}">
                                        <div class="form-text">英数字4~12文字で入力してください(必須)</div>
                                        <span class="invalid-feedback">パスワードの条件を満たしていません</span>
                                    </div>
                                </div>
                                <div class="row mb-5" id="confirmSetDeletePassword_div">
                                    <label for="confirmSetDeletePassword" class="col-form-label col-sm-5">削除用パスワード(確認用)</label>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control" id="confirmSetDeletePassword" required>
                                        <div class="form-text">必須</div>
                                        <span class="invalid-feedback">パスワードが一致しません</span>
                                    </div>
                                </div>
                                <div class="form-check">
                                    <label class="form-check-label" for="downloadPasswordEnabled">ダウンロード用パスワードを設定</label>
                                    <input class="form-check-input" type="checkbox" id="downloadPasswordEnabled">
                                </div>
                                <div class="d-none" id="setDownloadPasswordGroup">
                                    <div class="row mb-5" id="setDownloadPassword_div">
                                        <label for="setDownloadPassword"
                                               class="col-form-label col-sm-5">ダウンロード用パスワード</label>
                                        <div class="col-sm-6">
                                            <input type="password" class="form-control" id="setDownloadPassword" required
                                                   pattern="[a-zA-Z0-9]{4,12}">
                                            <div class="form-text">英数字4~12文字で入力してください(必須)</div>
                                            <span class="invalid-feedback">パスワードの条件を満たしていません</span>
                                        </div>
                                    </div>
                                    <div class="row mb-5" id="confirmSetDownloadPassword_div">
                                        <label for="confirmSetDownloadPassword" class="col-form-label col-sm-5">ダウンロード用パスワード(確認用)</label>
                                        <div class="col-sm-6">
                                            <input type="password" class="form-control" id="confirmSetDownloadPassword" required>
                                            <div class="form-text">必須</div>
                                            <span class="invalid-feedback">パスワードが一致しません</span>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="col-md-6">
                            <div id="uploader"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="uploadModalCloseButtonFooter">とじる</button>
                <button type="button" id="uploadButton" class="btn btn-primary" disabled>アップロード</button>
            </div>
        </div>
    </div>
</div>

<!-- 削除またはダウンロード用モーダル -->
<div class="modal fade" id="fileControlModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="fileControlModalTitle"></h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="fileControlPassword">パスワード</label>
                        <input type="password" class="form-control" id="fileControlPassword">
                        <input type="hidden" id="targetFileName" name="targetFileName">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                <button type="button" class="btn" data-bs-dismiss="modal" id="fileControlExecuteButton"></button>
            </div>
        </div>
    </div>
</div>

<!-- ユーザー登録のモーダル -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="registerModalTitle">ユーザー登録</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="userName">ユーザー名</label>
                        <input type="text" class="form-control registerFormElement" id="userName" required pattern="[a-zA-Z0-9]{4,12}">
                    </div>
                    <div class="mb-3">
                        <label for="userPassword">パスワード</label>
                        <input type="password" class="form-control registerFormElement" id="userPassword" required pattern="[a-zA-Z0-9]{4,12}">
                    </div>
                    <div class="mb-3">
                        <label for="confirmUserPassword">パスワード(確認用)</label>
                        <input type="password" class="form-control registerFormElement" id="confirmUserPassword" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                <button type="button" class="btn btn-primary" id="registerExecuteButton">登録</button>
            </div>
        </div>
    </div>
</div>

<!-- ログアウト用モーダル -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="logoutModalTitle">確認</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>ログアウトしますか？</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                <button type="button" class="btn btn-danger" id="logoutExecuteButton">ログアウト</button>
            </div>
        </div>
    </div>
</div>

<!-- ログイン用モーダル -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="loginModalTitle">ログイン</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginUserName">ユーザー名</label>
                        <input type="text" class="form-control registerFormElement" id="loginUserName" required>
                    </div>
                    <div class="mb-3">
                        <label for="loginUserPassword">パスワード</label>
                        <input type="password" class="form-control registerFormElement" id="loginUserPassword" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                <button type="button" class="btn btn-primary" id="loginExecuteButton">ログイン</button>
            </div>
        </div>
    </div>
</div>

<!-- ファイルリストのテーブル -->
<div class="container mt-5">
    <table id="files-table"></table>
</div>

<!-- スクロール確認用スペーサー -->
<div style="height: 200vh;"></div>
<p>a</p>

<!-- トースト用のコンテナ -->
<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

</body>
</html>
