<!DOCTYPE html>
<!-- タイムリーフとスプリングセキュリティを名前空間に追加 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ファイルアップローダー</title>
    <meta name="description" content="ファイルのダウンロードとアップロードのページ">

    <!-- csrfトークンとヘッダー -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- uppy(アップローダー) -->
    <script src="https://cdn.jsdelivr.net/npm/uppy@5.2.4/dist/uppy.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/uppy@5.2.4/dist/uppy.min.css" rel="stylesheet">

    <!-- jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <!--
    <script src="https://gcore.jsdelivr.net/npm/bootstrap-table@1.26.0/dist/bootstrap-table.min.js"></script>
    <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/bootstrap-table@1.26.0/dist/bootstrap-table.min.css">
-->
    <script src="https://cdn.datatables.net/2.3.8/js/dataTables.js"></script>
    <link href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.css" rel="stylesheet">


</head>
<body>
<div class="container mt-5">
    <div id="uploader"></div>
    <table id="files-table"></table>
</div>

</body>
<script src="/js/table.js"></script>
<script src="/js/uploader.js"></script>
</html>
